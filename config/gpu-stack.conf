# =============================================================================
#  gpu-stack.conf —— GPU 用户态驱动栈开关（宏）
# =============================================================================
#  本文件只定义一件事：镜像里要不要预装 Mali-G610 的用户态驱动，装哪一套。
#  优先级：环境变量 > 本文件 > none（即：下面这行用 "${GPU_STACK:-none}"，
#  所以 GPU_STACK=both bash build/docker/build.sh 会覆盖本文件的设置）。
#
#  可选值：
#    none      不装（默认）。行为与旧版完全一致：Kali 官方 Mesa 26，
#              上游 panfrost 驱动配不上 Arm kbase（/dev/mali0）→ GL 回退
#              llvmpipe，全程 CPU 软渲染（glmark2 约 40 分）。
#
#    panfork   只装 panfork mesa（PPA:1:23.0.5~panfork，配 kbase）。
#              拿到 X11 桌面 GL / GLX / glamor 硬件加速，glmark2 约 1000~1600。
#              代价：mesa 家族被降级到 23.x 并 apt-mark hold；需要联网从
#              Launchpad 拉包，并从 Ubuntu jammy ports 补一个 libllvm14。
#
#    libmali   只装 Rockchip 官方 libmali 闭源 blob（packages/gpu/ 下的 deb）。
#              拿到 GLES 3.2 / EGL / Vulkan 1.3 / OpenCL 3.0，以及无 X 的
#              GBM/DRM 直出（kmscube 实测 60fps）。桌面仍是软渲染。
#
#    both      两者都装（推荐）。默认路径归 panfork（桌面/GLX），libmali 只按需
#              启用（计算/无 X 场景）：LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/mali
#              <程序>。两套共用内核 kbase，互不冲突。
#
#  改完本文件后重新构建：改的是构建期输入，不是 overlay，所以需要
#    INCREMENTAL=1 bash build/docker/build.sh     # 只重跑 GPU 阶段
#  指纹里带了 GPU_STACK 的值，切换开关会自动让该阶段失效重跑。
# =============================================================================

GPU_STACK="${GPU_STACK:-none}"
