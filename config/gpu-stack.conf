# =============================================================================
#  gpu-stack.conf —— GPU 用户态驱动栈开关（宏）
# =============================================================================
#  本文件定义两件事：
#    ① 镜像里要不要预装 Mali 用户态驱动、装哪一套（GPU_STACK）
#    ② 目标 SoC 是哪个（SOC）—— 决定 libmali 包目录、是否需要 CSF 固件
#  优先级：环境变量 > 本文件 > 默认值（因此
#  `SOC=rk3576 GPU_STACK=libmali bash build/docker/build.sh` 会覆盖本文件）。
#
#  ── GPU_STACK 可选值 ────────────────────────────────────────────────────────
#    none      不装（默认）。行为与旧版完全一致：Kali 官方 Mesa 26，
#              上游 panfrost 驱动配不上 Arm kbase（/dev/mali0）→ GL 回退
#              llvmpipe，全程 CPU 软渲染（glmark2 约 40 分）。
#
#    panfork   只装 panfork mesa（PPA:1:23.0.5~panfork，配 kbase）。
#              拿到 X11 桌面 GL / GLX / glamor 硬件加速。
#              代价：mesa 家族被降级到 23.x 并 apt-mark hold；需要联网从
#              Launchpad 拉包，并从 Ubuntu jammy ports 补一个 libllvm14。
#
#    libmali   只装 Rockchip 官方 libmali 闭源 blob（packages/gpu/<SOC>/ 下的 deb）。
#              拿到 GLES / EGL / Vulkan / OpenCL，以及无 X 的 GBM/DRM 直出。
#              桌面仍是软渲染（libmali 不提供桌面 GL）。
#
#    both      两者都装（推荐）。默认路径归 panfork（桌面/GLX），libmali 只按需
#              启用（计算/无 X 场景）：LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/mali
#              <程序>。两套共用内核 kbase，互不冲突。
#
#  ── SOC 可选值 ─────────────────────────────────────────────────────────────
#    rk3588    Mali-G610 MP4（Valhall / CSF）→ 需要 mali_csffw 固件；
#              GPU 节点 fb000000.gpu；用户态包 libmali-valhall-g610-*
#    rk3576    Mali-G52 MC3（Bifrost / JM）→ 无 CSF 固件；
#              GPU 节点 27800000.gpu；用户态包 libmali-bifrost-g52-*
#
#  改完本文件后重新构建：改的是构建期输入，不是 overlay，所以需要
#    INCREMENTAL=1 bash build/docker/build.sh     # 只重跑 GPU 阶段
#  指纹里带了 GPU_STACK 与 SOC 的值，切换开关/换 SoC 会自动让该阶段失效重跑。
# =============================================================================

GPU_STACK="${GPU_STACK:-none}"

# ── 目标 SoC ────────────────────────────────────────────────────────────────
# 取值：rk3588 | rk3576 | rk356x（rk356x 同时覆盖 rk3566 / rk3568）。
# 它决定：libmali 取 packages/gpu/<SOC>/ 的包、是否需要 CSF 固件、mk-updateimg 的 chip 参数。
#
# 注意：具体是哪块板子（LubanCat-5 还是 5IOB、3 还是 3IO）**不需要在这里指定** ——
# 首启时 boot_init 会按 ADC 读板卡 ID 再软链 /boot/rk-kernel.dtb（见
# overlay/usr/local/boot_init.sh 的 board_info）。构建期只按 SoC 分类。
SOC="${SOC:-rk3588}"

# GPU 家族与固件需求按 SoC 推导（都允许用环境变量显式覆盖）
case "${SOC}" in
        rk3588)
                GPU_FAMILY="${GPU_FAMILY:-valhall}"
                NEEDS_CSF_FW="${NEEDS_CSF_FW:-1}"
                ;;
        rk3576)
                GPU_FAMILY="${GPU_FAMILY:-bifrost}"
                NEEDS_CSF_FW="${NEEDS_CSF_FW:-0}"
                ;;
        rk356x)
                # rk3566 / rk3568：同一颗 Mali-G52 2EE（Bifrost/JM），与 rk3576 同族；
                # 无 CSF 固件环节；libmali 包按"家族+DDK"命名，两者共用同一份 deb。
                GPU_FAMILY="${GPU_FAMILY:-bifrost}"
                NEEDS_CSF_FW="${NEEDS_CSF_FW:-0}"
                ;;
        *)
                # 未知 SoC 不在这里退出（本文件被 build.sh/entrypoint.sh 共同 source），
                # 由 build-rootfs.sh 统一校验并报错。
                GPU_FAMILY="${GPU_FAMILY:-unknown}"
                NEEDS_CSF_FW="${NEEDS_CSF_FW:-0}"
                ;;
esac
