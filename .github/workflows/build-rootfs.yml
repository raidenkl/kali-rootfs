name: Build Kali Rootfs

# =============================================================================
#  在 GitHub Actions 上用 docker 构建 kali rootfs
# =============================================================================
#  矩阵覆盖两个平台，用来验证「x86_64 docker」和「arm64 docker」都能正常构建：
#
#     ubuntu-24.04-arm  →  arm64 原生，无 qemu，构建快 3~8 倍
#     ubuntu-latest     →  x86_64，走 qemu-user-static 模拟 arm64
#
#  两者跑的是**同一个 Dockerfile 和同一套脚本**，差别只在宿主架构。
#  这正是要验证的点：容器方案在两种架构下是否行为一致。
#
#  ★ 平台选择：手动触发（Run workflow）时可用 build_arm64 / build_x86_64
#  两个开关分别控制跑不跑（x86_64 默认不跑，省时间）；push / PR 触发时
#  两个平台都照常跑，行为不变。
#
#  ⚠ 磁盘：runner 根分区实际有 72GB，但预装了 Android SDK / .NET / Haskell
#  等占掉约 50GB。清理步骤能释放到 53~55GB 可用，够 rootfs + img 的峰值需求。
#  这一步不能省，否则 debootstrap 中途会 No space left on device。
#
#  ⚠ 产物：rootfs 5~10GB + rootfs.img 5~8GB。单个 artifact 上限 10GB，
#  免费账号总存储 500MB。所以默认**不上传产物**，只做构建验证 + 体积报告。
#  需要产物时手动触发并勾选 upload_artifact。
# =============================================================================

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'build/**'
      - 'overlay/**'
      - 'overlay-firmware/**'
      - 'packages/**'
      - 'config/**'
      - '.github/workflows/build-rootfs.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'build/**'
      - 'overlay/**'
      - 'config/**'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:
    inputs:
      board:
        description: '板卡'
        required: true
        default: 'lubancat-4'
        type: choice
        options:
          - lubancat-4
          - lubancat-4io
          - lubancat-5
          - lubancat-5io
          - lubancat-5-v2
      build_arm64:
        description: '编译 arm64（原生，40~90 分钟）'
        required: true
        default: true
        type: boolean
      build_x86_64:
        description: '编译 x86_64（qemu 交叉，90~180 分钟）'
        required: true
        default: false
        type: boolean
      upload_artifact:
        description: '上传产物（占用大量存储，谨慎开启）'
        required: true
        default: false
        type: boolean
      run_mk_image:
        description: '执行 mk-image.sh 打包 rootfs.img'
        required: true
        default: true
        type: boolean

# 同一分支后推的 run 取消先推的，避免浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.board || 'lubancat-4' }}
  cancel-in-progress: true

env:
  IMAGE_TAG: kali-rootfs-builder:ci
  BOARD: ${{ github.event.inputs.board || 'lubancat-4' }}

jobs:
  # ===========================================================================
  #  构建
  # ===========================================================================
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}

    strategy:
      # 一个架构失败不影响另一个 —— 这本来就是双平台对照测试
      fail-fast: false
      matrix:
        include:
          - label: arm64-native
            runner: ubuntu-24.04-arm
            arch: arm64
            need_qemu: '0'
            # 手动触发时按 inputs 决定跑不跑；push/PR 时恒为 true（两腿照跑）
            enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.build_arm64 }}
          - label: x86_64-qemu
            runner: ubuntu-latest
            arch: amd64
            need_qemu: '1'
            enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.build_x86_64 }}

    # matrix 上下文在 job 级 if 里不可用（GitHub 限制：矩阵展开前求值），
    # 所以 enabled 先在矩阵里按平台算好，这里只读结果。
    if: matrix.enabled == true

    # 首次全量构建 40~90 分钟，给足余量（上限 6 小时）
    timeout-minutes: 240

    steps:
      # -----------------------------------------------------------------------
      # 1. 清理磁盘 —— 必须最先做
      # -----------------------------------------------------------------------
      #  runner 预装的这些内容对本项目毫无用处：
      #    /usr/local/lib/android   9.5GB (x64)   Android SDK/NDK
      #    /usr/local/.ghcup        6.4GB (x64)   Haskell
      #    /usr/lib/jvm             1.5GB (arm64) Java JDK
      #    /usr/share/dotnet        3.4GB         .NET
      #    /usr/share/swift         3.2GB         Swift
      #    /opt/hostedtoolcache     6.0GB (x64)   预缓存工具链
      #  只删确认不用的，保留 docker / git / python。
      - name: 清理磁盘空间
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/.ghcup    || true
          sudo rm -rf /usr/lib/jvm         || true
          sudo rm -rf /usr/share/dotnet    || true
          sudo rm -rf /usr/share/swift     || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/share/boost || true
          # 清理 docker 预装镜像（本项目自带构建环境，不需要）
          docker image prune -af || true
          sudo apt-get clean || true
          echo ""
          echo "=== 清理后 ==="
          df -h /
          AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
          echo "可用空间: ${AVAIL_MB}MB"
          if [ "${AVAIL_MB}" -lt 20000 ]; then
            echo "::warning::可用磁盘仅 ${AVAIL_MB}MB，低于建议的 20GB"
          fi

      # -----------------------------------------------------------------------
      # 2. 检出
      # -----------------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 仓库里 overlay-firmware 有 374 个二进制文件（88MB），
          # 用普通 clone 即可，不需要 LFS
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 3. 环境信息（对照两个架构的差异）
      # -----------------------------------------------------------------------
      - name: 环境信息
        run: |
          ARCH="$(uname -m)"
          echo "=== Runner ==="
          echo "架构      : ${ARCH}"
          echo "内核      : $(uname -r)"
          echo "CPU       : $(nproc) 核"
          echo ""
          echo "=== Docker ==="
          docker version --format '客户端: {{.Client.Version}} / 服务端: {{.Server.Version}}'
          docker buildx version
          echo ""
          echo "=== binfmt（仅交叉构建需要）==="
          if [ "${ARCH}" = "aarch64" ] || [ "${ARCH}" = "arm64" ]; then
            echo "宿主为原生 arm64 → 不需要 qemu binfmt（未注册属正常）"
          elif [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "qemu-aarch64 已注册"
            cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || true
          else
            echo "qemu-aarch64 未注册 → 下一步会注册"
          fi
          echo ""
          echo "=== 需要的空间 ==="
          echo "rootfs 目录树 + rootfs.img 峰值约 20GB"

      # -----------------------------------------------------------------------
      # 4. 注册 qemu binfmt（仅交叉构建需要）
      # -----------------------------------------------------------------------
      #  arm64 runner 是原生执行，完全不碰 qemu，所以跳过。
      #  x86_64 runner 必须注册，否则 chroot 内的 arm64 二进制报
      #  "Exec format error"，而那个报错毫无提示作用。
      #
      #  ★ 注意：这里注册的是【宿主】的 binfmt。binfmt_misc 跨 namespace 全局
      #  共享，宿主注册后容器内零额外权限即可用。容器内 entrypoint.sh 也会
      #  按自身架构判断是否需要，两者是独立的双保险。
      - name: 注册 qemu-aarch64 binfmt
        if: matrix.need_qemu == '1'
        run: |
          ARCH="$(uname -m)"
          echo ">>> 宿主架构: ${ARCH}"

          if [ "${ARCH}" = "aarch64" ] || [ "${ARCH}" = "arm64" ]; then
            echo "原生 arm64，不需要 qemu，跳过"
            exit 0
          fi

          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "已注册，跳过"
          else
            sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          fi

          echo ""
          echo "=== 验证 ==="
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
            echo "::error::binfmt 注册失败"
            exit 1
          }
          echo ""
          echo "=== 冒烟测试：能否执行 arm64 二进制 ==="
          sudo docker run --rm --platform linux/arm64 alpine:3.20 uname -m

      # -----------------------------------------------------------------------
      # 5. 构建薄容器镜像
      # -----------------------------------------------------------------------
      - name: 构建 docker 镜像
        run: |
          set -o pipefail
          echo ">>> docker build（宿主架构 $(uname -m)）"
          # APT_MIRROR：runner 在海外，覆盖回 kali 官方 GeoIP 源（本地默认阿里云，
          # 见 Dockerfile 的 APT_MIRROR 注释 —— 两边各用最快的源）
          docker build \
            --file Dockerfile \
            --build-arg APT_MIRROR=https://http.kali.org/kali \
            --tag "${IMAGE_TAG}" \
            --progress plain \
            . 2>&1 | tee /tmp/docker-build.log
          echo ""
          echo "=== 镜像信息 ==="
          docker image inspect "${IMAGE_TAG}" \
            --format '大小: {{.Size}} bytes' || true
          echo ""
          echo "=== 确认 qemu 安装策略生效 ==="
          # 注意：新版 Debian/Kali 里 qemu-user 自己就是静态的，二进制名不带
          # -static 后缀；qemu-user-static 包已于 2026-01 被 Debian 删除
          # （bug #1124747），装它不再创建 -static 软链。
          # 镜像里已补建软链；这里做校验并打印诊断信息，便于定位。
          ARCH="$(uname -m)"
          if [ "${ARCH}" = "aarch64" ] || [ "${ARCH}" = "arm64" ]; then
            if docker run --rm --entrypoint sh "${IMAGE_TAG}" \
                 -c 'test -e /usr/bin/qemu-aarch64-static' 2>/dev/null; then
              echo "::warning::arm64 镜像里出现了 qemu-aarch64-static（不必要）"
            else
              echo "OK: arm64 镜像未装 qemu（符合预期，原生执行）"
            fi
          else
            echo "--- 镜像内 qemu 文件 ---"
            docker run --rm --entrypoint sh "${IMAGE_TAG}" \
              -c 'ls -l /usr/bin/qemu-aarch64* 2>&1 || true' || true
            if docker run --rm --entrypoint sh "${IMAGE_TAG}" \
                 -c 'test -x /usr/bin/qemu-aarch64-static' 2>/dev/null; then
              echo "OK: x86_64 镜像已备 qemu-aarch64-static（交叉构建必需）"
            else
              echo "::error::x86_64 镜像缺少 /usr/bin/qemu-aarch64-static"
              echo "         build-rootfs.sh 第 50 行会因此改走原生分支，交叉构建可能异常。"
              echo "         该文件应由 Dockerfile 补建的软链提供，请检查上面的构建日志中"
              echo "         '>>> 补建 /usr/bin/qemu-aarch64-static' 那行的输出。"
              exit 1
            fi
          fi
          docker images "${IMAGE_TAG%:*}"

      # -----------------------------------------------------------------------
      # 6. 运行构建（关键步骤）
      # -----------------------------------------------------------------------
      #  这里完全走 build/docker/build.sh 的同一条路径：
      #    docker run --privileged -v <repo>:/work/kali-rootfs <image>
      #  入口脚本会调 build-rootfs.sh，然后调 mk-image.sh。
      #
      #  用 --privileged 是因为 build-rootfs.sh 要往 chroot 里 mount
      #  proc/sysfs/dev，且需要 seccomp/AppArmor 放行 mount 系统调用。
      - name: 运行 rootfs 构建
        id: build
        run: |
          set -o pipefail
          echo ">>> 开始构建（板卡: ${BOARD}，宿主架构: $(uname -m)）"
          echo ">>> arm64 原生约 40~70 分钟 / x86_64 交叉约 90~180 分钟，请耐心等待"
          echo ""
          START=$(date +%s)

          # 注意：不要用 -it（CI 无 TTY）。这里直接 docker run 而不经 build.sh，
          # 是为了把 stdout 同时 tee 到日志文件，便于失败时排查。
          sudo docker run --rm \
            --privileged \
            -v "${GITHUB_WORKSPACE}":/work/kali-rootfs \
            -w /work/kali-rootfs \
            -e BOARD="${BOARD}" \
            -e FORCE_REBUILD=1 \
            "${IMAGE_TAG}" 2>&1 | tee /tmp/rootfs-build.log

          EXIT_CODE=${PIPESTATUS[0]}
          END=$(date +%s)
          echo ""
          echo "耗时: $(( (END - START) / 60 )) 分 $(( (END - START) % 60 )) 秒"
          echo "退出码: ${EXIT_CODE}"
          exit "${EXIT_CODE}"

      # -----------------------------------------------------------------------
      # 7. 验证产物
      # -----------------------------------------------------------------------
      #  重点验证三个「容器适配层」是否真的生效 —— 这些是裸机流程同样会踩、
      #  但更容易在容器里踩到的坑。
      - name: 验证产物
        if: always() && steps.build.outcome == 'success'
        run: |
          echo "=== 产物清单 ==="
          ls -lh build/ || true
          echo ""

          FAIL=0

          # --- 7.1 rootfs 目录树存在 ---
          if [ -d build/rootfs ]; then
            SIZE=$(du -sh --apparent-size build/rootfs | cut -f1)
            echo "[OK] build/rootfs 存在，表观大小 ${SIZE}"
          else
            echo "[FAIL] build/rootfs 不存在"
            FAIL=1
          fi

          # --- 7.2 rootfs.img 存在 ---
          if [ -f build/rootfs.img ]; then
            SIZE=$(stat -c%s build/rootfs.img)
            echo "[OK] build/rootfs.img 存在，$(numfmt --to=iec-i --suffix=B "${SIZE}")"
          else
            echo "[FAIL] build/rootfs.img 不存在"
            FAIL=1
          fi

          # --- 7.3 ★ 检查 img 里没有混入宿主 /dev ---
          #  这是最危险的坑：build-rootfs.sh 把容器 /dev bind 进 chroot，
          #  若卸载不净，mkfs.ext4 -d 会把宿主几百个设备节点灌进镜像。
          if [ -f build/rootfs.img ]; then
            DEV_COUNT=$(debugfs -R "ls /dev" build/rootfs.img 2>/dev/null | wc -l || echo 0)
            echo ""
            echo "[检查] img 内 /dev 条目数: ${DEV_COUNT}"
            if [ "${DEV_COUNT}" -gt 40 ]; then
              echo "[FAIL] /dev 条目异常多（${DEV_COUNT}），很可能混入了宿主设备节点"
              debugfs -R "ls -l /dev" build/rootfs.img 2>/dev/null | head -20
              FAIL=1
            else
              echo "[OK] /dev 内容正常（应只有 null/zero/random 等少数几个）"
            fi
          fi

          # --- 7.4 ★ 检查 qemu 残留已删 ---
          if [ -f build/rootfs.img ]; then
            echo ""
            if debugfs -R "stat /usr/bin/qemu-aarch64-static" build/rootfs.img 2>&1 | grep -qi "not found\|File not found"; then
              echo "[OK] qemu-aarch64-static 已从 img 中移除"
            else
              echo "[FAIL] qemu-aarch64-static 仍留在 img 中（x86_64 二进制不该进 arm64 产物）"
              FAIL=1
            fi
          fi

          # --- 7.5 ★ 检查 board hook 生效 ---
          #  config_image_hook__<board>() 只被 config-image.sh 调用，
          #  entrypoint.sh 负责补调。不生效说明补调逻辑有问题。
          if [ -f build/rootfs.img ]; then
            echo ""
            if debugfs -R "stat /etc/udev/rules.d/90-naming-audios.rules" build/rootfs.img 2>&1 | grep -qi "not found\|File not found"; then
              echo "[WARN] 90-naming-audios.rules 不存在，board hook 可能未生效"
            else
              echo "[OK] board hook 生效（声卡命名规则在位）"
            fi
            if debugfs -R "stat /usr/lib/systemd/system/rtl8852be-reload.service" build/rootfs.img 2>&1 | grep -qi "not found\|File not found"; then
              echo "[WARN] rtl8852be-reload.service 不存在，board hook 可能未生效"
            else
              echo "[OK] rtl8852be-reload.service 在位"
            fi
          fi

          # --- 7.6 文件系统健康度 ---
          if [ -f build/rootfs.img ]; then
            echo ""
            if e2fsck -fn build/rootfs.img >/dev/null 2>&1; then
              echo "[OK] e2fsck 检查通过"
            else
              echo "[WARN] e2fsck 报告了问题（用 -n 只读检查）"
              e2fsck -fn build/rootfs.img 2>&1 | tail -20 || true
            fi
            echo ""
            echo "=== ext4 镜像信息 ==="
            dumpe2fs -h build/rootfs.img 2>/dev/null | grep -E \
              "Block count|Block size|Free blocks|Filesystem features" || true
          fi

          # --- 7.7 rootfs 关键内容抽查 ---
          if [ -d build/rootfs ]; then
            echo ""
            echo "=== rootfs 关键路径抽查 ==="
            for p in etc/passwd etc/hostname usr/bin/bash etc/apt/sources.list; do
              [ -e "build/rootfs/$p" ] && echo "  [OK] $p" || echo "  [MISS] $p"
            done
          fi

          echo ""
          if [ "${FAIL}" -eq 1 ]; then
            echo "::error::产物验证未通过"
            exit 1
          fi
          echo "=== 验证通过 ==="

      # -----------------------------------------------------------------------
      # 8. 体积报告
      # -----------------------------------------------------------------------
      - name: 产物体积报告
        if: always()
        run: |
          {
            echo "## 构建结果 — ${{ matrix.label }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| Runner | \`${{ matrix.runner }}\` |"
            echo "| 宿主架构 | $(uname -m) |"
            echo "| 构建结果 | ${{ steps.build.outcome }} |"
            echo ""
            if [ -d build/rootfs ]; then
              echo "| rootfs 目录树 | $(du -sh --apparent-size build/rootfs 2>/dev/null | cut -f1) |"
              echo "| rootfs 文件数 | $(find build/rootfs -type f 2>/dev/null | wc -l) |"
            fi
            if [ -f build/rootfs.img ]; then
              echo "| rootfs.img | $(du -h build/rootfs.img | cut -f1) |"
            fi
            echo ""
            echo "### 磁盘使用"
            echo '```'
            df -h /
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # -----------------------------------------------------------------------
      # 9. 上传构建日志（总是上传，用于失败排查）
      # -----------------------------------------------------------------------
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.label }}
          path: |
            /tmp/rootfs-build.log
            /tmp/docker-build.log
          retention-days: 14
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # 10. 上传产物（默认关闭）
      # -----------------------------------------------------------------------
      #  单 artifact 上限 10GB，免费账号总存储 500MB。
      #  rootfs.img 通常 5~8GB，远超免费额度，所以只在手动触发时按需开启。
      #  开启前建议先确认账号存储配额。
      - name: 打包产物
        if: always() && github.event.inputs.upload_artifact == 'true' && steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          if [ -f build/rootfs.img ]; then
            echo ">>> 压缩 rootfs.img（xz -3 -T0，压缩后通常 <2GB）"
            xz -3 -T0 -k build/rootfs.img
            mv build/rootfs.img.xz "dist/rootfs-${BOARD}-${{ matrix.label }}.img.xz"
            rm -f build/rootfs.img
            echo ""
            echo "=== 压缩结果 ==="
            ls -lh dist/
            df -h /
          else
            echo "::warning::build/rootfs.img 不存在，无产物可打包"
          fi

      - name: 上传产物
        if: always() && github.event.inputs.upload_artifact == 'true' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kali-rootfs-${{ matrix.label }}-${{ env.BOARD }}
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
