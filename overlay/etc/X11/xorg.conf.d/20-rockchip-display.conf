# RK3576/RK3588 上 rknpu 也会注册一张 DRM 卡（platform:27700000.npu）。
# Xorg 的 platform 探测找不到 "primary" 设备时会退回第一个 —— 也就是 NPU 那张，
# modesetting 驱动不了它 → 退回 fbdev → "Cannot run in framebuffer mode"，
# lightdm 于是反复重启（start-limit-hit），表现就是"卡在开机、进不了桌面"。
#
# 这里把 modesetting 钉在 display-subsystem 上：
#   BusID  —— 只负责匹配；匹配不到时等价于没有这条配置（不会引入新风险）
#   kmsdev —— 显式打开正确的 KMS 设备，避免两张 platform 卡之间的歧义
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier  "rockchip-display"
    Driver      "modesetting"
    BusID       "platform:display-subsystem"
    Option      "kmsdev" "/dev/dri/by-path/platform-display-subsystem-card"
    Option      "AccelMethod" "glamor"
EndSection
