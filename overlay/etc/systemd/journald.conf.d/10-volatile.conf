# =============================================================================
# journal 易失化（不跨开机持久化）
# -----------------------------------------------------------------------------
# 背景：LubanCat 板卡默认无 RTC 电池，每次开机时钟会被拨回 systemd 内置
# epoch（2026-07-24 02:31:52）。跨开机的持久化 journal 因此总被判定为
# "realtime clock jumped backwards"，journald 启动即执行 rotate；
# 该 rotate 曾与 systemd-journal-flush（oneshot、默认无启动超时）互相卡死，
# 导致 sysinit.target 无法完成、第二次开机没有登录界面（详见
# build/docker/README.md「首次开机流程与日志策略」）。
#
# Storage=volatile：journal 只存内存（/run/log/journal），不存在跨开机
# 状态 ⇒ 永不需要 rotate ⇒ 对时钟回拨彻底免疫。
# 代价：重启后 journalctl -b -1 不可用；诊断依赖串口控制台输出与
# ramoops/pstore。如需临时恢复持久日志：删除本文件并
# mkdir -p /var/log/journal && systemctl restart systemd-journald
# （前提：已通过 rtcsync/fake-hwclock 保证时钟单调，否则会复现卡死）。
# =============================================================================

[Journal]
Storage=volatile
